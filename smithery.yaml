# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  command: ["python", "stylebook_mcp_server.py", "--stdio", "--data_path", "."]
  schema:
    properties:
      action:
        type: "string"
        enum:
          [
            "get_metadata",
            "get_categories",
            "get_rule",
            "search",
            "claude_search",
            "download_json",
          ]
        description: "실행할 도구 이름"
      rule_id:
        type: "string"
        description: "규칙 ID (get_rule, download_json 도구용)"
      query:
        type: "string"
        description: "검색어 (search, claude_search 도구용)"
      desktop_port:
        type: "number"
        description: "Claude 데스크톱 앱의 통신 포트 (기본값: 5000)"
    required: ["action"]
  examples:
    - action: "search"
      query: "외래어 표기법"
