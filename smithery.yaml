# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

displayName: 서울경제신문 스타일북 MCP
description: 서울경제신문 스타일북을 검색하고 조회할 수 있는 MCP 서버
icon: 📚
author: 서울경제신문
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      port:
        type: number
        default: 5012
        description: 서버 포트 번호
      data_path:
        type: string
        default: "."
        description: 스타일북 데이터 경로
    required: []
  commandFunction: |
    ({ config }) => {
      // 스크립트 파일의 상대 경로를 구성합니다
      const scriptPath = "stylebook_mcp_fastmcp.py";
      
      return {
        command: "python",
        args: ["-u", scriptPath, "--stdio", "--verbose", "--data_path", config.data_path || "."],
        env: {
          "PYTHONUNBUFFERED": "1",
          "PYTHONIOENCODING": "utf-8",
          "PYTHONFLAGS": "-u"
        }
      }
    }
